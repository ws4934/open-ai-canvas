name: Publish application

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version matching VERSION and CHANGELOG, including v"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/quality.yml

  prepare:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.info.outputs.version }}
      release: ${{ steps.info.outputs.release }}
      build_time: ${{ steps.info.outputs.build_time }}
      owner: ${{ steps.info.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: info
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash .github/scripts/prepare-release.sh

  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        env:
          CANVAS_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          CANVAS_BUILD_COMMIT: ${{ github.sha }}
          CANVAS_BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.VITE_TLDRAW_LICENSE_KEY }}
        run: bun --bun ./node_modules/vite/bin/vite.js build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [prepare, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/open-ai-canvas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: backend/internal/webui/dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the embedded application once
        uses: docker/build-push-action@v6
        with:
          context: .
          target: binary-export
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=dist
          build-args: |
            WEB_STAGE=web-prebuilt
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.build_time }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: Build image from that exact executable
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: BINARY_STAGE=binary-prebuilt
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Verify the actual image and package its executable
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          bash .github/scripts/smoke-release-image.sh "$IMAGE@$DIGEST"
          tar -czf "dist/open-ai-canvas_${RELEASE_VERSION}_linux_${ARCH}.tar.gz" -C dist yingce-backend
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p dist/digests
          touch "dist/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [checks, prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish complete artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/open-ai-canvas
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IS_RELEASE: ${{ needs.prepare.outputs.release }}
          DIGEST_DIR: dist/digests
          EXPECTED_DIGESTS: "2"
        run: bash .github/scripts/publish-release.sh
