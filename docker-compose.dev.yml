name: open-ai-canvas-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - ${CANVAS_POSTGRES_DATA_PATH:-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ${CANVAS_REDIS_DATA_PATH:-redis-data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine3.22}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    working_dir: /workspace/backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: "postgresql://postgres:5432/?sslmode=disable"
      PGDATABASE: ${POSTGRES_DB:-open_ai_canvas}
      PGUSER: ${POSTGRES_USER:-open_ai_canvas}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_ASYNC_POLL_TRANSIENT_RETRIES: ${CANVAS_ASYNC_POLL_TRANSIENT_RETRIES:-0}
      CANVAS_AGENT_MAX_PROCESSES: ${CANVAS_AGENT_MAX_PROCESSES:-30}
      CANVAS_AGENT_NODE_MEMORY_MB: ${CANVAS_AGENT_NODE_MEMORY_MB:-512}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3000}
      # 服务器访问地址：Agent 看图与生成参考图都靠它签发上游可取到的短时链接。
      CANVAS_PUBLIC_BASE_URL: ${CANVAS_PUBLIC_BASE_URL:-}
      CANVAS_LOG_LEVEL: ${CANVAS_LOG_LEVEL:-debug}
      GIN_MODE: debug
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ./backend/agent-runtime/pi/agent-runtime.mjs
        target: /opt/canvas-agent/agent-runtime.mjs
        read_only: true
      # 禁止 Compose 静默创建新数据目录，避免开发时误用另一套账号数据。
      - type: bind
        source: ./.local/project-workbench-debug
        target: /data
        bind:
          create_host_path: false
      # 持久化首次下载和 CGO 编译结果，容器重建后继续复用开发缓存。
      - type: bind
        source: ./.local/cache/go-build
        target: /tmp/go-build
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/cache/go-mod
        target: /tmp/go-mod
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${CANVAS_BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true

  web:
    image: oven/bun:1.3.13
    working_dir: /workspace/web
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run dev"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
    volumes:
      - type: bind
        source: .
        target: /workspace
      - web-node-modules:/workspace/web/node_modules
      - web-bun-cache:/root/.bun/install/cache
    ports:
      - "${CANVAS_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    init: true

volumes:
  postgres-data:
  redis-data:
  web-node-modules:
  web-bun-cache:
